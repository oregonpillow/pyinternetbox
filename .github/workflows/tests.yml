name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so hatch-vcs can work out the version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Isort check (ruff)
        run: uv run ruff check --select I .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Prettier check
        run: npx --yes prettier --check .

      - name: Deptry check
        run: uv run deptry .

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing
