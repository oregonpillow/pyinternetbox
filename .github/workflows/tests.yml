name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so hatch-vcs can work out the version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Isort check (ruff)
        run: uv run ruff check --select I .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Prettier check
        run: npx --yes prettier --check .

      - name: Deptry check
        run: uv run deptry .

      - name: Check requirements.txt is up to date
        run: |
          uv export --no-dev --no-header --output-file /tmp/requirements.txt
          diff requirements.txt /tmp/requirements.txt

      - name: Check requirements-dev.txt is up to date
        run: |
          uv export --only-dev --no-header --output-file /tmp/requirements-dev.txt
          diff requirements-dev.txt /tmp/requirements-dev.txt

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing
