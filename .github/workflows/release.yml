name: Release

# master push  -> Docker image  oregonpillow/pyinternetbox:edge
# tag vX.Y.Z   -> PyPI package, Docker images :X.Y.Z, :X.Y and :latest, GitHub Release with the notes from CHANGELOG.md,
#                 then the documentation site on GitHub Pages (docs.yml)
#
# The version always comes from the git tag (via hatch-vcs); nothing else needs bumping.

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: oregonpillow/pyinternetbox

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to compute the version

      # Before anything is published: a release needs its notes in CHANGELOG.md.
      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Determine version
        id: version
        run: |
          wheel=$(basename dist/*.whl)
          version=$(echo "$wheel" | cut -d- -f2)
          echo "Built version: $version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::Package version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyinternetbox
    permissions:
      id-token: write # trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docker-hub
      url: https://hub.docker.com/r/oregonpillow/pyinternetbox
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto # :latest only for non-prerelease version tags
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.build.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    if: github.ref_type == 'tag'
    needs: [pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true # adds the "Full Changelog" link below the notes

  docs:
    if: github.ref_type == 'tag'
    needs: github-release
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
