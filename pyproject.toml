[project]
name = "pyinternetbox"
version = "0.1.0"
description = "Internet Box API client and exporter for Swisscom and Wingo routers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.14.0",
    "requests>=2.33.0",
    "typer>=0.24.1",
]

[project.scripts]
ibox = "internetbox_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["internetbox_client"]

[tool.ruff]
line-length = 140

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.per-file-ignores]
# star imports are dirty by nature but clean by appearance ¯\_(ツ)_/¯
"internetbox_client/client.py" = ["F405"]
"tests/test_e2e.py" = ["F405"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_e2e.py --cov-fail-under 85"

markers = [
    "e2e: end-to-end integration tests against a live Internet Box gateway",
    "destructive: tests that write to the router (LED brightness, Wi-Fi TX power, MST rules)",
]

[tool.coverage.run]
omit = ["internetbox_client/cli.py"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]
