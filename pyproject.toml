[project]
name = "pyinternetbox"
dynamic = ["version"]
description = "Internet Box API client, MCP server and exporter for Swisscom and Wingo routers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timothy Pillow", email = "oregonpillow@gmail.com" }]
requires-python = ">=3.12"
keywords = ["swisscom", "wingo", "internet-box", "router", "prometheus", "exporter", "sysbus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
]
dependencies = [
    "prometheus-client>=0.14.0",
    "requests>=2.33.0",
    "typer>=0.24.1",
]

[project.urls]
Homepage = "https://github.com/oregonpillow/pyinternetbox"
Documentation = "https://oregonpillow.github.io/pyinternetbox/"
Repository = "https://github.com/oregonpillow/pyinternetbox"
Issues = "https://github.com/oregonpillow/pyinternetbox/issues"
Releases = "https://github.com/oregonpillow/pyinternetbox/releases"
"Docker image" = "https://hub.docker.com/r/oregonpillow/pyinternetbox"

[project.scripts]
ibox = "internetbox_client.cli:app"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
    "pydantic>=2.12.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the latest git tag (e.g. v0.2.0 -> 0.2.0). Untagged
# commits get a dev version such as 0.2.1.dev3+g1a2b3c4. Builds without git
# history (e.g. a plain `docker build`) fall back to 0.0.0 unless
# SETUPTOOLS_SCM_PRETEND_VERSION is set.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["internetbox_client"]

[tool.hatch.build.targets.sdist]
include = ["internetbox_client", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 140
# Ruff 0.16+ also formats Python code blocks in Markdown; prettier handles the Markdown here
extend-exclude = ["*.md"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
# The default rule set from before Ruff 0.16, which enables many more rules by default
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.per-file-ignores]
# star imports are dirty by nature but clean by appearance ¯\_(ツ)_/¯
"internetbox_client/client.py" = ["F405"]
"tests/test_e2e.py" = ["F405"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_e2e.py --cov-fail-under 85"

markers = [
    "e2e: end-to-end integration tests against a live Internet Box gateway",
    "destructive: tests that change router settings and then revert them (or only touch dummy rules and a fake MAC address)",
    "disruptive: tests that briefly interrupt the network for everyone, e.g. Wi-Fi off and on; skipped unless IB_E2E_DISRUPTIVE=1",
]

[tool.coverage.run]
omit = ["internetbox_client/cli.py"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mcp>=2.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]
docs = [
    "mkdocstrings-python>=2.0.11",
    "zensical>=0.1.3",
]
