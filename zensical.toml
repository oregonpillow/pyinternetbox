# The documentation site, built with Zensical (https://zensical.org) and published to GitHub Pages by
# .github/workflows/docs.yml. Preview it with: uv run --group docs zensical serve
[project]
site_name = "pyinternetbox"
site_url = "https://oregonpillow.github.io/pyinternetbox/"
site_description = "Python library, CLI, Prometheus exporter and MCP server for the Swisscom Internet Box."
site_author = "Timothy Pillow"
repo_url = "https://github.com/oregonpillow/pyinternetbox"
repo_name = "oregonpillow/pyinternetbox"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Exporter" = "exporter.md" },
  { "MCP server" = "mcp.md" },
  { "Reference" = [
    "reference/environment-variables.md",
    "reference/without-password.md",
    "reference/models.md",
    # One page per group of InternetBoxClient; tests/test_docs.py checks they're all here.
    { "Library" = [
      "reference/library/index.md",
      "reference/library/ap_services.md",
      "reference/library/carddav.md",
      "reference/library/debug.md",
      "reference/library/dect.md",
      "reference/library/devices.md",
      "reference/library/dhcp.md",
      "reference/library/dns.md",
      "reference/library/dyndns.md",
      "reference/library/events.md",
      "reference/library/firewall.md",
      "reference/library/genlog.md",
      "reference/library/history.md",
      "reference/library/http_service.md",
      "reference/library/lan.md",
      "reference/library/led.md",
      "reference/library/mitigation.md",
      "reference/library/mst.md",
      "reference/library/nmc.md",
      "reference/library/oops_tracker.md",
      "reference/library/password_recovery.md",
      "reference/library/phonebook.md",
      "reference/library/power_management.md",
      "reference/library/scheduler.md",
      "reference/library/security.md",
      "reference/library/speedtest.md",
      "reference/library/static.md",
      "reference/library/sysbus.md",
      "reference/library/temperature.md",
      "reference/library/user_management.md",
      "reference/library/voice.md",
      "reference/library/vpn.md",
      "reference/library/webui.md",
      "reference/library/wifi.md",
      "reference/library/wireguard.md",
      "reference/library/wwan.md",
    ] },
  ] },
  { "Contributing" = [
    "contributing/index.md",
    "contributing/development.md",
    "contributing/releasing.md",
    { "Missing endpoints" = "MISSING_ENDPOINTS.md" },
    { "API map" = "API_MAP.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
# changelog.md includes CHANGELOG.md from the repository root.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true

# The library reference, from the docstrings.
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
heading_level = 2
show_root_heading = false
show_root_toc_entry = false
show_source = false
show_bases = false
separate_signature = true
show_signature_annotations = true
